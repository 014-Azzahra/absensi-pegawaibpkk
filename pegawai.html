<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Pegawai – Presensi PPNPN</title>
<style>
  /* ==========================================
     RESET & VARIABEL DASAR
     ========================================== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: #f1f5f9;
    color: #1e293b;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ==========================================
     NAVBAR ATAS
     ========================================== */
  .top-navbar {
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-area svg { flex-shrink: 0; }
  .brand-text strong { display: block; font-size: 1.2rem; color: #1a56db; font-weight: 800; line-height: 1.2; }
  .brand-text span { font-size: 0.85rem; color: #64748b; font-weight: 500; }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-nav {
    display: flex; align-items: center; gap: 8px;
    background: #eff6ff; color: #1a56db;
    border: 1px solid #bfdbfe; padding: 10px 20px;
    border-radius: 8px; text-decoration: none;
    font-weight: 600; font-size: 0.9rem; transition: 0.2s;
  }
  .btn-nav:hover { background: #dbeafe; }

  .btn-logout {
    display: flex; align-items: center; gap: 8px;
    background: #fef2f2; color: #dc2626;
    border: 1px solid #fecaca; padding: 10px 20px;
    border-radius: 8px; text-decoration: none;
    font-weight: 600; font-size: 0.9rem; transition: 0.2s;
  }
  .btn-logout:hover { background: #fee2e2; }

  /* ==========================================
     KONTEN UTAMA
     ========================================== */
  .app-main {
    flex: 1;
    padding: 32px 20px;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .absensi-wrapper {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ==========================================
     KARTU HEADER (NAMA & JAM)
     ========================================== */
  .header-card {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    border-radius: 16px;
    padding: 24px 32px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
  }
  .header-card h2 { margin: 0 0 4px 0; font-size: 1.4rem; font-weight: 700; }
  .header-card p { margin: 0; font-size: 0.95rem; opacity: 0.9; }
  .datetime-box { text-align: right; }
  .datetime-box h3 { margin: 0 0 4px 0; font-size: 2rem; font-weight: 700; letter-spacing: 1px; }
  .datetime-box span { font-size: 0.9rem; opacity: 0.9; }

  /* ==========================================
     STATUS LOKASI
     ========================================== */
  .location-badge {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-radius: 10px;
    font-weight: 600; font-size: 0.95rem;
    background: #ecfdf5; border: 1px solid #10b981; color: #065f46;
  }

  /* ==========================================
     KARTU FORM & TAB
     ========================================== */
  .form-card {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }

  /* Tab Switcher */
  .tab-container {
    display: flex;
    background: #f1f5f9;
    padding: 6px;
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: #64748b;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-family: inherit;
  }
  .tab-btn.active {
    background: #fff;
    color: #1a56db;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .tab-btn.active.pulang {
    color: #d97706;
  }

  /* Form Content */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 700; color: #334155; margin-bottom: 8px; }

  .form-control {
    width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1;
    border-radius: 10px; font-family: inherit; font-size: 0.95rem;
    background: #f8fafc; outline: none; transition: 0.2s;
  }
  .form-control:focus { border-color: #1a56db; background: #fff; box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
  textarea.form-control { min-height: 120px; resize: vertical; }

  /* Kamera */
  .camera-box {
    width: 100%; background: #1e293b; border-radius: 12px;
    aspect-ratio: 16 / 9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #94a3b8;
    cursor: pointer; transition: 0.2s; border: 2px dashed #475569;
    margin-bottom: 20px;
  }
  .camera-box:hover { background: #0f172a; border-color: #64748b; }
  .camera-box svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.7; }
  .camera-box p { font-size: 0.95rem; font-weight: 500; }

  /* Tombol Submit */
  .btn-submit {
    width: 100%; padding: 16px; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
    color: #fff; display: flex; justify-content: center; align-items: center; gap: 8px;
    font-family: inherit;
  }
  .btn-submit.masuk { background: #1a56db; box-shadow: 0 4px 10px rgba(26,86,219,0.2); }
  .btn-submit.masuk:hover { background: #1e40af; }
  .btn-submit.pulang { background: #d97706; box-shadow: 0 4px 10px rgba(217,119,6,0.2); }
  .btn-submit.pulang:hover { background: #b45309; }

  /* ==========================================
     RESPONSIF MOBILE
     ========================================== */
  @media (max-width: 768px) {
    .top-navbar { flex-direction: column; align-items: flex-start; gap: 16px; padding: 16px; }
    .nav-actions { width: 100%; flex-direction: column; }
    .btn-nav, .btn-logout { width: 100%; justify-content: center; }
    .header-card { flex-direction: column; align-items: flex-start; gap: 16px; padding: 20px; }
    .datetime-box { text-align: left; width: 100%; }
  }
</style>
</head>
<body>

  <!-- ================= NAVBAR ATAS ================= -->
  <header class="top-navbar">
    <div class="brand-area">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1a56db" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <div class="brand-text">
        <strong>BPKK Kendari</strong>
        <span>Sistem Presensi PPNPN</span>
      </div>
    </div>

    <div class="nav-actions">
      <a href="rekap.html" class="btn-nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Lihat Rekap Kehadiran
      </a>

      <a href="index.html" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Keluar
      </a>
    </div>
  </header>

  <!-- ================= KONTEN UTAMA ================= -->
  <main class="app-main">
    <div class="absensi-wrapper">

      <!-- Header Card -->
      <div class="header-card">
        <div>
          <h2>Andi Pratama</h2>
          <p>Staff Administrasi</p>
        </div>
        <div class="datetime-box">
          <h3>08:30:00</h3>
          <span>Kamis, 22 Oktober 2026</span>
        </div>
      </div>

      <!-- Status Lokasi -->
      <div class="location-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Anda berada di dalam radius kantor (Maks. 500m).
      </div>

      <!-- KARTU FORM -->
      <div class="form-card">

        <!-- TAB SWITCHER -->
        <div class="tab-container">
          <button type="button" class="tab-btn active" id="btn-tab-masuk" onclick="bukaTab('masuk')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            Absen Masuk
          </button>
          <button type="button" class="tab-btn" id="btn-tab-pulang" onclick="bukaTab('pulang')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Absen Pulang
          </button>
        </div>

        <!-- KONTEN: ABSEN MASUK -->
        <div class="tab-content active" id="content-masuk">
          <div class="form-group">
            <label for="status-kehadiran">Status Kehadiran</label>
            <select id="status-kehadiran" class="form-control">
              <option value="" disabled selected>-- Pilih Kehadiran --</option>
              <option value="hadir">Hadir (Di Kantor)</option>
              <option value="wfh">WFH (Work From Home)</option>
              <option value="izin">Izin (Tidak Hadir)</option>
            </select>
          </div>

          <div class="form-group">
            <label style="color: #ef4444;">Alasan Izin</label>
            <textarea id="alasan-izin" class="form-control" placeholder="Tuliskan alasan tidak hadir..."></textarea>
          </div>

          <div class="form-group">
            <label>Foto Selfie Presensi</label>
            <div class="camera-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <p>Klik untuk membuka kamera</p>
            </div>
          </div>

          <button class="btn-submit masuk" type="button">
            Kirim Absen Masuk
          </button>
        </div>

        <!-- KONTEN: ABSEN PULANG -->
        <div class="tab-content" id="content-pulang">
          <div class="form-group">
            <label for="kegiatan-pulang">Kegiatan Hari Ini</label>
            <textarea id="kegiatan-pulang" class="form-control" placeholder="Tuliskan ringkasan kegiatan yang Anda lakukan hari ini..." style="min-height: 100px;"></textarea>
          </div>

          <div class="form-group">
            <label>Foto Selfie Presensi</label>
            <div class="camera-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <p>Klik untuk membuka kamera</p>
            </div>
          </div>

          <button class="btn-submit pulang" type="button">
            Kirim Absen Pulang
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= SCRIPT MINIMAL: HANYA UNTUK TAB ================= -->
  <script>
    function bukaTab(tipe) {
      // Reset semua tab
      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.classList.remove('active', 'pulang');
      });
      document.querySelectorAll('.tab-content').forEach(function(content) {
        content.classList.remove('active');
      });

      // Aktifkan tab yang dipilih
      if (tipe === 'masuk') {
        document.getElementById('btn-tab-masuk').classList.add('active');
        document.getElementById('content-masuk').classList.add('active');
      } else {
        var btnPulang = document.getElementById('btn-tab-pulang');
        btnPulang.classList.add('active', 'pulang');
        document.getElementById('content-pulang').classList.add('active');
      }
    }
  </script>
</body>
</html>
