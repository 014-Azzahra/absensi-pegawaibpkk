<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Absensi PPNPN BPKK Kendari</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-split-layout">

<!-- Panel Kiri (Biru) -->
<div class="login-left">
  <div class="left-content">
    <div class="label-top">
      <span class="line"></span> PRESENSI PEGAWAI
    </div>
    <h1>Kehadiran Tercatat,<br>Kinerja Terpantau</h1>
    <p>Pencatatan dan pengelolaan kehadiran karyawan PPNPN BPKK Kendari.</p>
  </div>
  
  <div class="ornament-container">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="dot"></div>
    <div class="half-circle"></div>
  </div>
</div>

<!-- Panel Kanan (Form) -->
<div class="login-right">
  <div class="top-bar">
    <img src="img/logo-bpkk.png" alt="Logo Kemnaker BPKK Kendari" class="logo-kemnaker">
    <a href="loginadmin.html" class="link-admin-top">Masuk sebagai admin</a>
  </div>

  <div class="form-container">
    <h2>Selamat datang.</h2>
    <p class="subtitle">Masuk dengan akun pegawai Anda untuk mencatat dan melihat riwayat kehadiran.</p>

    <form id="form-login">
      <div class="field">
        <label for="user">Nama pengguna</label>
        <div class="input-with-icon">
          <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="user" name="user" autocomplete="username" placeholder="Masukkan nama pengguna" required>
        </div>
      </div>

      <div class="field">
        <label for="pass">Kata sandi</label>
        <div class="input-with-icon">
          <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          
          <!-- Ikon Mata yang bisa diklik -->
          <svg id="toggle-password" class="icon-right" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
      </div>

      <div class="form-actions">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Ingat saya
        </label>
        <a href="lupasandi.html" class="link-forgot">Lupa kata sandi?</a>
      </div>

      <button class="btn-primary block" type="submit" id="btn-submit">
        <span id="btn-text">Masuk ke presensi</span>
        <svg id="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div class="divider"></div>
    <p class="footer-hint">
      Belum memiliki akun? <a href="https://wa.me/6281234567890" target="_blank" class="link-admin-bottom">Hubungi admin</a>
    </p>
  </div>
</div>

<script>
const SESSION_KEY = 'bpkk_user_aktif';
document.getElementById('toggle-password')?.addEventListener('click', function () {
  const input = document.getElementById('pass');
  input.type = input.type === 'password' ? 'text' : 'password';
});
document.getElementById('form-login').addEventListener('submit', async function (event) {
  event.preventDefault();
  const button = document.getElementById('btn-submit');
  const label = document.getElementById('btn-text');
  const username = document.getElementById('user').value.trim().toLowerCase();
  button.disabled = true; label.textContent = 'Memproses...';
  try {
    const response = await fetch('js/data/pegawai.json');
    const pegawai = await response.json();
    const selected = pegawai.find(p => p.id.toLowerCase() === username || p.nama.toLowerCase() === username);
    if (!selected) {
      alert('Akun demo tidak ditemukan. Gunakan ID PPNPN001–PPNPN030 atau nama pegawai pada data dummy.');
      return;
    }
    localStorage.setItem(SESSION_KEY, selected.id);
    location.href = 'pegawai.html';
  } catch (error) { alert('Data pegawai gagal dimuat. Jalankan proyek melalui Live Server.'); }
  finally { button.disabled = false; label.textContent = 'Masuk ke presensi'; }
});
</script>
</body>
</html>
