<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin – Absensi PPNPN BPKK Kendari</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Sedikit penyesuaian khusus untuk halaman admin */
  .login-left.admin-theme {
    background-color: #0f172a; /* Warna biru sangat gelap / slate */
  }
  .login-left.admin-theme .half-circle {
    background: #1e293b; /* Warna ornamen disesuaikan */
  }
  .btn-primary.admin-btn {
    background: #0f172a;
  }
  .btn-primary.admin-btn:hover {
    background: #1e293b;
  }
  .user-icon-wrapper.admin-icon {
    background: #f1f5f9;
    color: #0f172a;
  }
</style>
</head>
<body class="login-split-layout">

<!-- Panel Kiri (Biru Gelap) -->
<div class="login-left admin-theme">
  <div class="left-content">
    <div class="label-top">
      <span class="line"></span> AREA ADMINISTRATOR
    </div>
    <h1>Panel Kendali<br>Sistem Presensi</h1>
    <p>Kelola data kehadiran, akun pegawai, dan unduh laporan PPNPN BPKK Kendari.</p>
  </div>
  
  <!-- Ornamen Lingkaran & Titik -->
  <div class="ornament-container">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="dot"></div>
    <div class="half-circle"></div>
  </div>
</div>

<!-- Panel Kanan (Form Login Admin) -->
<div class="login-right">
  
  <div class="top-bar">
    <img src="img/logo-bpkk.png" alt="Logo Kemnaker BPKK Kendari" class="logo-kemnaker">
    <!-- Tautan kembali ke login pegawai -->
    <a href="index.html" class="link-admin-top">Login sebagai pegawai</a>
  </div>

  <div class="form-container">
    <h2>Login Admin.</h2>
    <p class="subtitle">Gunakan akun administrator Anda untuk mengakses panel kendali sistem.</p>

    <form action="admin.html" method="post">
      
      <div class="field">
        <label for="user">Nama pengguna (Admin)</label>
        <div class="input-with-icon">
          <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="user" name="user" autocomplete="username" placeholder="Masukkan nama pengguna admin" required>
        </div>
      </div>

      <div class="field">
        <label for="pass">Kata sandi</label>
        <div class="input-with-icon">
          <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          <svg class="icon-right" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
      </div>

      <!-- Khusus admin biasanya tidak butuh "Ingat saya" untuk alasan keamanan, 
           tapi saya biarkan jika Anda membutuhkannya -->
      <div class="form-actions">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Ingat saya
        </label>
      </div>

      <button class="btn-primary block admin-btn" type="submit">
        Masuk sebagai Admin
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <div class="divider"></div>

    <p class="footer-hint">
      Halaman ini hanya untuk administrator.<br>
      <a href="index.html" class="link-admin-bottom">Kembali ke Login Pegawai</a>
    </p>
  </div>
</div>

</body>
</html>
